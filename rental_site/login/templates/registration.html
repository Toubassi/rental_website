{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Your Account | HomeFinder</title>
 
  <!-- Fonts from Google Fonts (needs internet; if it is blocked the page uses the fallback fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@400;500;600&display=swap" rel="stylesheet">
 
  <!-- Bootstrap 5 from our own static folder -->
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>
<body class="reg-body">
  <div class="reg-frame">
 
    <!-- LEFT: photo placeholder (smaller on tablets, hidden on phones) -->
    <section class="reg-side">
      <!-- Placeholder only. Later, replace the next 5 lines with:
           <img src="{% static 'img/your-photo.jpg' %}" alt="Student room" class="reg-photo-img"> -->
      <svg class="reg-photo-icon" role="img" aria-label="Photo placeholder" viewBox="0 0 24 24" fill="none" stroke="#24483F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      <span class="reg-chip">Photo: student room<span class="reg-chip-more"> or shared living</span></span>
      <span class="reg-arch reg-arch-1" aria-hidden="true"></span>
      <span class="reg-arch reg-arch-2" aria-hidden="true"></span>
    </section>
 
    <!-- RIGHT: the form card -->
    <main class="reg-main">
      <div class="reg-card">
        <div class="reg-inner">
 
          <header class="reg-top">
            <a href="/" class="reg-logo" aria-label="HomeFinder home">
              <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 29V14.5L16 3l13 11.5V29z" fill="#24483F"/><path d="M12 29v-8a4 4 0 0 1 8 0v8z" fill="#FAF7F0"/><circle cx="16" cy="12.5" r="2.2" fill="#C8795A"/></svg>
              <span>HomeFinder</span>
            </a>
            <a href="/" class="reg-back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
              Back to Home
            </a>
          </header>
 
          <div class="reg-content">
            <h1 class="reg-title">Create Your Account</h1>
            <p class="reg-subtitle">Find a place to call home.</p>
 
            {% if messages %}
              <div class="alert reg-alert" role="alert">
                {% for message in messages %}<div>{{ message }}</div>{% endfor %}
              </div>
            {% endif %}
 
            <form method="post" action="/register/" class="reg-form">
              {% csrf_token %}
 
              <!-- Full name -->
              <div>
                <label for="id_name" class="form-label">Full Name</label>
                <input type="text" id="id_name" name="name" class="form-control"
                       placeholder="Enter your full name" autocomplete="name" maxlength="150" required>
              </div>
 
              <!-- Date of birth: a normal text box that always shows DD/MM/YYYY (same on every browser) -->
              <div>
                <label for="id_dob" class="form-label">Date of Birth</label>
                <div class="reg-field">
                  <input type="text" id="id_dob" name="dob" class="form-control has-icon"
                         placeholder="DD/MM/YYYY" inputmode="numeric" autocomplete="off" maxlength="10"
                         pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" title="Write the date like this: 25/12/2005" required>
                  <button type="button" id="open-calendar" class="reg-ibtn" aria-label="Open date picker">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3 10h18"/></svg>
                  </button>
                  <!-- hidden helper: gives us the browser's calendar pop-up (see register.js). It is NOT sent to the server -->
                  <input type="date" id="calendar-helper" class="reg-date-picker" tabindex="-1" aria-hidden="true">
                </div>
              </div>
 
              <!-- Username -->
              <div>
                <label for="id_username" class="form-label">Username</label>
                <input type="text" id="id_username" name="username" class="form-control"
                       placeholder="Choose a username" autocomplete="username" maxlength="150" required>
              </div>
 
              <!-- Email -->
              <div>
                <label for="id_email" class="form-label">Email Address</label>
                <input type="email" id="id_email" name="email" class="form-control"
                       placeholder="Enter your email address" autocomplete="email" maxlength="150" required>
              </div>
 
              <!-- Password (never put a value="" here: the password is never sent back to the page) -->
              <div>
                <label for="id_password" class="form-label">Password</label>
                <div class="reg-field">
                  <input type="password" id="id_password" name="password" class="form-control has-icon"
                         placeholder="Create a password" autocomplete="new-password" required>
                  <button type="button" id="toggle-password" class="reg-ibtn" aria-label="Show password" aria-pressed="false" aria-controls="id_password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
                  </button>
                </div>
              </div>
 
              <!-- Confirm password -->
              <div>
                <label for="id_confirm_password" class="form-label">Confirm Password</label>
                <div class="reg-field">
                  <input type="password" id="id_confirm_password" name="confirm_password" class="form-control has-icon"
                         placeholder="Re-enter your password" autocomplete="new-password" required>
                  <button type="button" id="toggle-confirm" class="reg-ibtn" aria-label="Show password" aria-pressed="false" aria-controls="id_confirm_password">
                    <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
                  </button>
                </div>
              </div>
 
              <button type="submit" class="btn reg-submit">
                <span>Create Account</span>
                <span class="reg-submit-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
                </span>
              </button>
            </form>
 
            <p class="reg-signin">Already have an account? <a href="/login/">Sign In</a></p>
          </div>
 
        </div>
      </div>
    </main>
 
  </div>
 
  <script src="{% static 'js/register.js' %}"></script>
</body>
</html>
